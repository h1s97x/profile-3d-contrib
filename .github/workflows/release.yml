name: Verify Release

# 只做「发布前校验」，不创建 tag、不发布 Release、不修改 latest 分支。
# 分发产物不再是提交的 dist/，而是 GitHub container action 与 CNB 插件镜像
# 共用的 Dockerfile + src/。
on:
  release:
    types: [published]

jobs:
  verify:
    name: Verify release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "release tag : $TAG"
          echo "package.json: $PKG_VERSION"
          if [ "v$PKG_VERSION" != "$TAG" ]; then
            echo "::error::版本号不一致:tag 为 $TAG,但 package.json 为 $PKG_VERSION。"
            exit 1
          fi

      - name: Verify container action contract
        run: |
          test -s Dockerfile || { echo "::error::Dockerfile 缺失。"; exit 1; }
          test -s entrypoint.js || { echo "::error::镜像入口缺失。"; exit 1; }
          grep -q "using: 'docker'" action.yml || { echo "::error::action.yml 不是 container action。"; exit 1; }
          echo "container action: ok"

      - name: Summarize
        run: |
          {
            echo "### 发布校验通过"
            echo ""
            echo "- Tag: \`$GITHUB_REF_NAME\`"
            echo "- 分发方式: GitHub container action + CNB 插件镜像(共用 Dockerfile)"
            echo "- 仓库内不再提交 dist/: 是"
          } >> "$GITHUB_STEP_SUMMARY"
