name: Sync to CNB

# ============================================================================
# 架构说明(重要)
# ============================================================================
# 方向:GitHub 是唯一源(source of truth),CNB 是自动镜像。
#
# 为什么同步放在 GitHub Actions 侧而不是 .cnb.yml:
#   CNB 的插件模型是「Docker 镜像」,不存在 GitHub Actions 那种
#   uses: owner/repo@ref 的仓库引用。因此由 GitHub 主动推送是唯一
#   能做到「push 即同步」的方式。
#   CNB 侧的 .cnb.yml 只负责 CI(构建校验),不承担同步职责。
#
# 消费模型的差异(已在 docs/spec/00-takeover.md 记录):
#   GitHub 用户 → uses: YOUR_GITHUB_USER/YOUR_GITHUB_REPO@v1
#   CNB 用户    → 在自己的 .cnb.yml 中下载 dist/index.js 并用 node 执行
#                 (CNB 无仓库引用型 Action,详见 README 的 CNB 章节)
# ============================================================================

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: sync-cnb
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror main and tags to CNB
    runs-on: ubuntu-latest
    steps:
      # 同步全部历史与标签,否则镜像仓库会丢失提交记录
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push to CNB repository
        uses: docker://tencentcom/git-sync
        env:
          # CNB 仓库地址是公开信息,可直接写入;凭据必须走 secrets
          PLUGIN_TARGET_URL: https://cnb.cool/h1s97x/plugins/profile-3d-contrib.git
          PLUGIN_AUTH_TYPE: "https"
          PLUGIN_USERNAME: "cnb"
          # 需 CNB 访问令牌,权限:写入仓库。配置在 GitHub 仓库 Secrets 中
          PLUGIN_PASSWORD: ${{ secrets.CNB_TOKEN }}
          PLUGIN_BRANCH: "main"
          PLUGIN_PUSH_TAGS: "true"
          # 强制推送是镜像场景的必需项:
          #   latest 分支由 latest-branch.yml 强制推送更新,若此处不 force,
          #   镜像侧会因非快进而拒绝,导致两个平台状态漂移。
          PLUGIN_FORCE: "true"
          PLUGIN_GIT_USER: "github-actions[bot]"
          PLUGIN_GIT_EMAIL: "github-actions[bot]@users.noreply.github.com"
