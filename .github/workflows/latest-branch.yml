name: Update latest branch on release

# ============================================================================
# latest 分支策略(设计决策记录)
# ============================================================================
# 自 v0.9.0 起,本仓库通过 @latest 引用提供「始终最新」版本,方式是每次发版时把
# latest 分支强制指向新 tag。
#
# 风险:git push --force 会重写 latest 分支的提交历史。若有人把 latest 的某个
# 提交作为基线做了分支或 fork,强制推送后其历史将与新版本产生分叉。
#
# 当前判断:接管阶段仓库尚无外部引用 latest,该风险可控,故保留此设计以兼容
# 存量 @latest 引用。同时应通过 semver tag 引导用户 pin 具体版本。
#
# 未来若要取消此策略,需先在 README 中通知用户迁移至 semver tag,再移除本工作流。
# ============================================================================

on:
  release:
    types: [published]

jobs:
  update-latest-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update latest branch
        run: |
          git fetch origin
          git branch -f latest ${{ github.event.release.tag_name }}
          git push origin latest --force
