# ============================================================================
# CNB 侧云原生构建配置
# ============================================================================
# 定位:CI 职责(构建校验),**不承担 GitHub → CNB 的同步**。
#   同步由 GitHub 侧的 .github/workflows/sync-cnb.yml 主动推送完成,
#   原因见该文件顶部说明(CNB 插件模型为 Docker 镜像,无仓库引用型 Action)。
#
# 本文件随源码一同从 GitHub 镜像过来,保证两个平台的校验逻辑一致。
#
# 语法参考:
#   Pipeline/Stage/Job 三层结构 —— https://docs.cnb.cool/zh/build/grammar
#   环境变量与 imports    —— https://docs.cnb.cool/zh/build/env
# ============================================================================

main:
  push:
    - name: verify
      docker:
        image: node:24
      stages:
        - name: install
          jobs:
            - name: Install dependencies
              # 使用 npm ci 而非 npm install:确保依赖树与 package-lock.json 严格一致
              script: npm ci

        - name: build
          jobs:
            - name: Build dist
              script: npm run build

        - name: verify-dist
          jobs:
            - name: Ensure dist matches source
              # 与 GitHub 侧 ci.yml 的 dist-consistency 检查等效。
              # 镜像仓库的 dist/ 若与源码不一致,说明同步过程出了问题,
              # 此时 CNB 用户从镜像拉到的产物就是错的,必须阻断。
              script: |
                if ! git diff --exit-code -- dist/; then
                  echo "::error::dist/ 与源码不一致,CNB 镜像产物已过期。"
                  echo "::error::请检查 sync-cnb 工作流是否成功执行。"
                  exit 1
                fi

            - name: Ensure entry point exists
              script: |
                test -s dist/index.js || { echo "::error::dist/index.js 缺失或为空。"; exit 1; }
                echo "dist/index.js size: $(du -h dist/index.js | cut -f1)"

  pull_request:
    - name: verify
      docker:
        image: node:24
      stages:
        - name: install
          jobs:
            - name: Install dependencies
              script: npm ci

        - name: build
          jobs:
            - name: Build dist
              script: npm run build

        - name: verify-dist
          jobs:
            - name: Ensure dist matches source
              script: |
                if ! git diff --exit-code -- dist/; then
                  echo "::error::dist/ 与源码不一致。"
                  exit 1
                fi
