# ============================================================================
# CNB 主仓云原生构建配置
# ============================================================================
# 定位:本仓库(cnb.cool/h1s97x/plugins/profile-3d-contrib)是唯一源(source of truth)。
#   GitHub 侧仓库仅用于兼容存量 uses: 引用,不再向本仓推送。
#
# 分发产物:Dockerfile + src/(GitHub container action 与 CNB 插件镜像共用)。
#   仓库不再提交 dist/,故不存在产物一致性闸门,改为校验源码质量与镜像契约。
# ============================================================================

main:
  push:
    - name: verify
      docker:
        image: node:24
      stages:
        - name: install
          jobs:
            - name: Install dependencies
              # npm ci 确保依赖树与 package-lock.json 严格一致
              script: npm ci

        - name: quality
          jobs:
            - name: Lint and type check
              script: npm run lint
            - name: Test
              script: npm test

        - name: verify-image-contract
          jobs:
            - name: Ensure the image sources are intact
              script: |
                test -s Dockerfile || { echo "ERROR: Dockerfile 缺失"; exit 1; }
                test -s docker/entrypoint.js || { echo "ERROR: 镜像入口缺失"; exit 1; }
                grep -q "using: 'docker'" action.yml || { echo "ERROR: action.yml 不是 container action"; exit 1; }
                node --check docker/entrypoint.js
            - name: Verify build chain
              script: npm run build

  pull_request:
    - name: verify
      docker:
        image: node:24
      stages:
        - name: install
          jobs:
            - name: Install dependencies
              script: npm ci

        - name: quality
          jobs:
            - name: Lint and type check
              script: npm run lint
            - name: Test
              script: npm test

        - name: verify-image-contract
          jobs:
            - name: Ensure the image sources are intact
              script: |
                test -s Dockerfile || { echo "ERROR: Dockerfile 缺失"; exit 1; }
                test -s docker/entrypoint.js || { echo "ERROR: 镜像入口缺失"; exit 1; }
                grep -q "using: 'docker'" action.yml || { echo "ERROR: action.yml 不是 container action"; exit 1; }
                node --check docker/entrypoint.js

# ============================================================================
# 插件镜像发布:打 v* tag 时构建并推送到本仓库自带的 Docker 制品库。
# GitHub 侧不引用该镜像(制品库需鉴权,runner 无法匿名拉取),而是由
# action.yml 的 image: 'Dockerfile' 在同一份源码上现场构建。
# ============================================================================
v*:
  tag_push:
    - name: publish-plugin-image
      services:
        - docker
      stages:
        - name: build-and-push
          script: |
            set -e
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            TAG="${CNB_BRANCH}"
            echo "${CNB_TOKEN}" | docker login "${CNB_DOCKER_REGISTRY}" -u cnb --password-stdin
            docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
            docker push "${IMAGE}:${TAG}"
            docker push "${IMAGE}:latest"
