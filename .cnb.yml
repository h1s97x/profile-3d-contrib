# ============================================================================
# CNB 主仓云原生构建配置
# ============================================================================
# 定位:本仓库(cnb.cool/h1s97x/plugins/profile-3d-contrib)是唯一源(source of truth),
#   本文件在主仓上直接执行 CI 校验,不存在任何镜像同步链路。
#   GitHub 侧仓库若仍存在,仅用于兼容存量 uses: 引用,不再向本仓推送。
#
# 原 .github/workflows/sync-cnb.yml(GitHub → CNB 强推全量历史)已删除:
#   主仓切到 CNB 后,该链路会让 GitHub 侧的一次 push 覆盖本仓 main 分支。
#
# 语法参考:
#   Pipeline/Stage/Job 三层结构 —— https://docs.cnb.cool/zh/build/grammar
#   环境变量与 imports    —— https://docs.cnb.cool/zh/build/env
# ============================================================================

main:
  push:
    - name: verify
      docker:
        image: node:24
      stages:
        - name: install
          jobs:
            - name: Install dependencies
              # 使用 npm ci 而非 npm install:确保依赖树与 package-lock.json 严格一致
              script: npm ci

        - name: build
          jobs:
            - name: Build dist
              script: npm run build

        - name: verify-dist
          jobs:
            - name: Ensure dist matches source
              # 主仓的 dist/ 若与源码不一致,用户下载到的产物就是错的,必须阻断。
              # 与 .github/workflows/ci.yml 的 dist-consistency 检查等效。
              script: |
                if ! git diff --exit-code -- dist/; then
                  echo "ERROR: dist/ 与源码不一致。"
                  echo "ERROR: 请在本地执行 npm ci && npm run build 后重新提交 dist/。"
                  exit 1
                fi

            - name: Ensure entry point exists
              script: |
                test -s dist/index.js || { echo "ERROR: dist/index.js 缺失或为空。"; exit 1; }
                echo "dist/index.js size: $(du -h dist/index.js | cut -f1)"

  pull_request:
    - name: verify
      docker:
        image: node:24
      stages:
        - name: install
          jobs:
            - name: Install dependencies
              script: npm ci

        - name: build
          jobs:
            - name: Build dist
              script: npm run build

        - name: verify-dist
          jobs:
            - name: Ensure dist matches source
              script: |
                if ! git diff --exit-code -- dist/; then
                  echo "ERROR: dist/ 与源码不一致。"
                  exit 1
                fi
