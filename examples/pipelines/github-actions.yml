# GitHub container action 用法：action.yml 没有定义 inputs，
# 扁平选项通过 env 传入（入口脚本同时接受 PLUGIN_* 与无前缀 env）。
name: Generate 3D contributions
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: h1s97x/profile-3d-contrib@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          THEME: gitblock
          OUTPUT: profile-gitblock.svg
      - name: Commit generated SVGs
        run: |
          git config user.name github-actions
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -A profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No changes, skipping commit."
          else
            git commit -m generated
            git push
          fi
